/* --- BARRE DE PROGRESSION DE DÉFILEMENT --- */
#scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #2563eb, #8b5cf6);
  z-index: 9999;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
  transition: width 0.05s linear;
}

/* --- CURSEUR EN FLAMME BLEUE REVISITÉ ET COMPACT --- */
#custom-cursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 34px;
  height: 34px;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-30%, -20%);
  transition: transform 0.02s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cursor-flame-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.9));
  animation: flamePulse 1.1s infinite alternate ease-in-out;
}

@keyframes flamePulse {
  0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.8)); }
  50% { transform: scale(1.06) rotate(-3deg); filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.95)); }
  100% { transform: scale(0.95) rotate(3deg); filter: drop-shadow(0 0 7px rgba(139, 92, 246, 0.9)); }
}

/* Particules de traînée de feu */
.flame-particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 9998;
  animation: fadeOutParticle 0.4s linear forwards;
}

@keyframes fadeOutParticle {
  0% { opacity: 0.85; transform: scale(1) translateY(0); }
  100% { opacity: 0; transform: scale(0.2) translateY(-12px); }
}

<script>
  // --- 1. GESTION DE LA BARRE DE PROGRESSION ---
  const progressBar = document.getElementById('scroll-progress');
  window.addEventListener('scroll', () => {
    const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = (window.scrollY / totalHeight) * 100;
    progressBar.style.width = Math.min(Math.max(progress, 0), 100) + '%';
  });

  // --- 2. CURSEUR SUR MESURE (FLAMME BLEUE + TRAÎNÉE) ---
  const cursor = document.getElementById('custom-cursor');
  let lastX = 0, lastY = 0;

  window.addEventListener('mousemove', (e) => {
    // Déplacement fluide du curseur
    cursor.style.transform = `translate(${e.clientX - 10}px, ${e.clientY - 8}px)`;

    // Génération de petites particules de feu au mouvement
    const dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    if (dist > 12) {
      createFlameParticle(e.clientX, e.clientY);
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });

  function createFlameParticle(x, y) {
    const p = document.createElement('div');
    p.className = 'flame-particle';
    const size = Math.random() * 8 + 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = (x - size / 2) + 'px';
    p.style.top = (y + 10) + 'px';

    // Nuances de bleu et cyan pour la flamme
    const colors = ['#38bdf8', '#60a5fa', '#3b82f6', '#8b5cf6'];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = `0 0 8px ${p.style.background}`;

    document.body.appendChild(p);

    setTimeout(() => {
      p.remove();
    }, 450);
  }

  // Active state navigation sidebar
  const navLinks = document.querySelectorAll('#sidebar nav a');
  const sections = document.querySelectorAll('section');

  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(section => {
      const sectionTop = section.offsetTop;
      if (scrollY >= sectionTop - 120) {
        current = section.getAttribute('id');
      }
    });

    navLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('active');
      }
    });
  });
</script>
